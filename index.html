        let startDay = 12;
        let endDay = 18;

        document.addEventListener("DOMContentLoaded", () => {
            calculateCurrentWindow();
            renderRollingSevenDaysSchedule();
            renderFullSchedule();
            
            setInterval(() => {
                calculateCurrentWindow();
                renderRollingSevenDaysSchedule();
            }, 60000);
        });

        function calculateCurrentWindow() {
            const today = new Date();
            const currentDay = today.getDate();
            const currentMonth = today.getMonth();

            if (currentMonth === 5 && currentDay >= 12) {
                if (currentDay > 22) {
                    startDay = 22;
                    endDay = 28;
                } else {
                    const daysPassed = currentDay - 12;
                    const weekMultiplier = Math.floor(daysPassed / 7);
                    startDay = 12 + (weekMultiplier * 7);
                    endDay = startDay + 6;
                }
            } else {
                startDay = 12;
                endDay = 18;
            }
        }

        function getCountdownString(targetDay, targetHour) {
            const now = new Date();
            const targetDate = new Date(2026, 5, targetDay, Math.floor(targetHour), (targetHour % 1) * 60);
            const diffMs = targetDate - now;
            
            if (diffMs <= 0) {
                return `<span class="text-red-500 font-bold"><i class="fa-solid fa-circle-play text-[7px] animate-pulse"></i> লাইভ</span>`;
            }

            const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
            const diffHours = Math.floor((diffMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const diffMins = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));

            const bnNums = {'0':'০','1':'১','2':'২','3':'৩','4':'৪','5':'৫','6':'৬','7':'৭','8':'৮','9':'৯'};
            const toBn = (num) => String(num).split('').map(d => bnNums[d] || d).join('');

            let countdownStr = "";
            if (diffDays > 0) countdownStr += `${toBn(diffDays)}দ `;
            if (diffHours > 0 || diffDays > 0) countdownStr += `${toBn(diffHours)}ঘ `;
            countdownStr += `${toBn(diffMins)}মি`;

            return `<span class="text-amber-500 font-medium"><i class="fa-regular fa-clock text-[8px]"></i> ${countdownStr}</span>`;
        }

        function renderRollingSevenDaysSchedule() {
            const currentWeekMatches = matchSchedule.filter(m => m.day >= startDay && m.day <= endDay);
            const container = document.getElementById("rolling-matches-container");

            if (currentWeekMatches.length === 0) {
                container.innerHTML = `<p class="text-[10px] text-slate-500 bg-[#1c1d26] p-4 rounded-lg text-center border border-[#292a38]">ম্যাচ নেই</p>`;
                return;
            }

            container.innerHTML = currentWeekMatches.map(m => {
                const teams = m.match.split(" - ");
                const team1 = teams[0] || "A";
                const team2 = teams[1] || "B";
                const countdownHTML = getCountdownString(m.day, m.hour);
                const finalLink = (m.streamLink && m.streamLink.trim() !== "") ? m.streamLink : defaultStreamLink;

                return `
                    <a href="${finalLink}" target="_blank" class="block">
                        <div class="app-card rounded-lg p-2 flex flex-col gap-1 shadow-md border-[#292a38] active:bg-[#232430]">
                            <div class="flex items-center justify-between">
                                <div class="flex items-center gap-1 w-[38%]">
                                    <span class="text-lg">${m.team1Flag}</span>
                                    <span class="text-[10px] font-semibold truncate text-slate-100">${team1}</span>
                                </div>

                                <div class="text-center flex flex-col items-center justify-center w-[24%]">
                                    <span class="text-[10px] font-bold text-white leading-tight">${m.time}</span>
                                    <span class="text-[9px] text-blue-400 font-bold">${m.date}</span>
                                    <div class="text-[8px] mt-0.5">
                                        ${countdownHTML}
                                    </div>
                                </div>

                                <div class="flex items-center gap-1 w-[38%] justify-end text-right">
                                    <span class="text-[10px] font-semibold truncate text-slate-100">${team2}</span>
                                    <span class="text-lg">${m.team2Flag}</span>
                                </div>
                            </div>
                        </div>
                    </a>
                `;
            }).join('');
        }

        function renderFullSchedule() {
            const tbody = document.getElementById("full-schedule-tbody");
            tbody.innerHTML = matchSchedule.map(m => {
                return `
                    <tr class="border-b border-[#232430]">
                        <td class="p-1.5 font-semibold text-blue-400 whitespace-nowrap">${m.date}</td>
                        <td class="p-1.5 text-slate-200 text-left truncate max-w-[100px]">${m.match}</td>
                        <td class="p-1.5 font-semibold text-emerald-400 whitespace-nowrap">${m.time}</td>
                    </tr>
                `;
            }).join('');
        }

        function toggleScheduleViaFooter() {
            const section = document.getElementById("full-schedule-section");
            const footerBtn = document.getElementById("footer-sports-btn");

            if (section.classList.contains("hidden")) {
                section.classList.remove("hidden");
                footerBtn.classList.add("text-blue-500");
                setTimeout(() => section.scrollIntoView({ behavior: 'smooth' }), 50);
            } else {
                section.classList.add("hidden");
                footerBtn.classList.remove("text-blue-500");
            }
        }
