        // Free Fire style Loading Screen
        function startLoadingScreen() {
            const percentageText = document.getElementById("load-percentage");

            const preloader = document.getElementById("game-preloader");
            let currentLoad = 0;
            
            const interval = setInterval(() => {
                let increment = Math.floor(Math.random() * 8) + 2; 
                currentLoad += increment;
                
                if (currentLoad >= 90) {
                    currentLoad = 90; 
                    percentageText.innerText = currentLoad + "%";
                    progressBar.style.width = currentLoad + "%";
                    clearInterval(interval);
                    
                    setTimeout(() => {
                        preloader.classList.add("fade-out");
                        setTimeout(() => { preloader.style.display = "none"; }, 400);
                    }, 300);
                } else {
                    percentageText.innerText = currentLoad + "%";
                    progressBar.style.width = currentLoad + "%";
                }
            }, 120);

        // Match Live Status Logic
        function getMatchLiveStatus(targetMonth, targetDay, targetHour) {
            const now = new Date();
            const targetMins = Math.round((targetHour % 1) * 60);
            const targetFloorHour = Math.floor(targetHour);
            const targetDate = new Date(2026, targetMonth, targetDay, targetFloorHour, targetMins, 0);
            const diffMs = targetDate - now;
            const matchDurationMs = 120 * 60 * 1000; 
            const removalDelayMs = 30 * 60 * 1000;  
            
            if (diffMs < -(matchDurationMs + removalDelayMs)) return { status: 'removed', isLive: false, html: '' };
            if (diffMs < -matchDurationMs) {
                return { status: 'ended', isLive: false, html: `<span class="bg-red-950/40 text-red-400 border border-red-900/40 px-1.5 py-0.5 rounded text-[8px] font-bold tracking-wide uppercase">Finished</span>` };
            }
            if (diffMs <= 0) {
                return {
                    status: 'live', isLive: true,
                    html: `<span class="bg-red-500/10 text-red-500 border border-red-500/30 px-1.5 py-0.5 rounded text-[8px] font-bold flex items-center gap-0.5"><span class="w-1 h-1 rounded-full bg-red-500 animate-pulse"></span> LIVE</span>`
                };
            }

            const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
            const diffHours = Math.floor((diffMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const diffMins = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
            let countdownStr = "";
            if (diffDays > 0) countdownStr += `${diffDays}d `;
            if (diffHours > 0 || diffDays > 0) countdownStr += `${diffHours}h `;
            countdownStr += `${diffMins}m`;

            return {
                status: 'upcoming', isLive: false, html: `<span class="bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 px-1.5 py-0.5 rounded text-[8px] font-semibold flex items-center gap-0.5"><i class="fa-regular fa-clock text-[7px]"></i> ${countdownStr}</span>`
            };
        }

        function setFilter(filterType) {
            currentFilter = filterType;
            ['all', 'live', 'upcoming'].forEach(f => {
                const btn = document.getElementById(`btn-filter-${f}`);
                btn.className = f === filterType 
                    ? "bg-blue-600 text-white shadow-md shadow-blue-600/20 px-3 py-1 rounded-full text-[10px] font-bold whitespace-nowrap transition-all"
                    : "bg-[#1c1d26] text-slate-400 border border-[#232433] px-3 py-1 rounded-full text-[10px] font-bold whitespace-nowrap transition-all";
            });

            const titleElement = document.getElementById("section-title");
            titleElement.innerText = filterType === 'all' ? "2 Days Matches" : (filterType === 'live' ? "Live Matches" : "Upcoming Matches");
            renderRollingTwoDaysSchedule();
        }

        // 2 Days Match Renderer
        function renderRollingTwoDaysSchedule() {
            const today = new Date();
            const container = document.getElementById("rolling-matches-container");
            const allowedTimeframes = [];
            for (let i = 0; i < 2; i++) {
                const tempDate = new Date();
                tempDate.setDate(today.getDate() + i);
                allowedTimeframes.push({ month: tempDate.getMonth(), day: tempDate.getDate() });
            }

            const twoDayMatches = matchSchedule.filter(m => allowedTimeframes.some(t => t.month === m.month && t.day === m.day));
            const matchesWithStatus = twoDayMatches.map(m => ({ ...m, liveStatus: getMatchLiveStatus(m.month, m.day, m.hour) })).filter(m => m.liveStatus.status !== 'removed');

            let totalAll = 0, totalLive = 0, totalUpcoming = 0;
            matchesWithStatus.forEach(m => {
                totalAll++;
                if (m.liveStatus.status === 'live') totalLive++;
                if (m.liveStatus.status === 'upcoming') totalUpcoming++;
            });

            document.getElementById("count-all").innerText = totalAll;
            document.getElementById("count-live").innerText = totalLive;
            document.getElementById("count-upcoming").innerText = totalUpcoming;

            let filteredMatches = matchesWithStatus;
            if (currentFilter === 'live') filteredMatches = matchesWithStatus.filter(m => m.liveStatus.status === 'live');
            if (currentFilter === 'upcoming') filteredMatches = matchesWithStatus.filter(m => m.liveStatus.status === 'upcoming');

            let visibleCardsHtml = "";
            filteredMatches.forEach(m => {
                const teams = m.match.split(" - ");
                const team1 = teams[0] || m.match;
                const team2 = teams[1] || "";
                const finalLink = m.streamLink ? m.streamLink : defaultStreamLink;
                
                // রিয়াল টাইম স্ট্রিমিং ইন্ডিকেটর ভিউ
                const statusDetail = m.liveStatus.isLive 
                    ? `<span class="text-[7px] text-emerald-400 font-semibold uppercase animate-pulse block mt-1">Streaming Running</span>` 
                    : `<span class="text-[7px] text-slate-500 font-semibold block mt-1">Match Center</span>`;

                visibleCardsHtml += `
                     <a href="${finalLink}" target="_blank" class="block transform active:scale-98 transition-transform">
                         <div class="app-card rounded-xl p-2.5 flex flex-col gap-1.5 border border-[#232433]">
                             <div class="flex items-center justify-between">
                                 <div class="flex flex-col w-[35%] items-start">
                                     <div class="flex items-center gap-1 flex-wrap">
                                         <span class="text-sm">${m.team1Flag}</span>
                                         <span class="text-[9px] font-bold truncate text-slate-200 tracking-wide">${team1}</span>
                                     </div>
                                 </div>
                                 <div class="text-center flex flex-col items-center justify-center w-[30%] bg-black/20 p-1 rounded-lg border border-white/5">
                                     <span class="text-[9px] font-bold text-white leading-tight">${m.time}</span>
                                     <span class="text-[7px] text-blue-400 font-bold tracking-tight">${m.date}</span>
                                     <div class="mt-1 flex flex-col items-center gap-0.5">${m.liveStatus.html}</div>
                                     ${statusDetail}
                                 </div>
                                 <div class="flex flex-col w-[35%] items-end text-right">
                                     <div class="flex items-center gap-1 justify-end flex-wrap">
                                         <span class="text-[9px] font-bold truncate text-slate-200 tracking-wide">${team2}</span>
                                         <span class="text-sm">${m.team2Flag}</span>
                                     </div>
                                 </div>
                             </div>
                         </div>
                     </a>`;
            });
            container.innerHTML = visibleCardsHtml || `<p class="text-[10px] text-slate-500 bg-[#1c1d26] p-4 rounded-lg text-center border border-[#232433]">No matches found</p>`;
        }

        // Full Tournament Table Renderer
        function renderFullSchedule() {
            const tbody = document.getElementById("full-schedule-tbody");
            tbody.innerHTML = matchSchedule.map(m => `
                 <tr class="border-b border-[#191a24] hover:bg-white/2 transition-colors">
                     <td class="p-2 font-semibold text-blue-400 whitespace-nowrap">${m.date}</td>
                     <td class="p-2 text-slate-300 text-left truncate max-w-[110px] font-medium">${m.match}</td>
                     <td class="p-2 font-semibold text-emerald-400 whitespace-nowrap">${m.time}</td>
                 </tr>`).join('');
        }

        // Dynamic M3U Playlist Parser and Loader
        async function fetchAndRenderM3UPlaylist() {
            const container = document.getElementById("channels-container");
            try {
                const response = await fetch(m3uPlaylistUrl);
                if (!response.ok) throw new Error('Network response was not ok');
                
                const rawData = await response.text();
                const lines = rawData.split('\n');
                const parsedChannels = [];

                let currentChannel = { name: "", logo: "", streamLink: "" };

                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim();
                    
                    if (line.startsWith('#EXTINF:')) {
                        const logoMatch = line.match(/tvg-logo="([^"]+)"/i);
                        if (logoMatch && logoMatch[1]) {
                            currentChannel.logo = logoMatch[1];
                        }
                        const commaIndex = line.lastIndexOf(',');
                        if (commaIndex !== -1) {
                            currentChannel.name = line.substring(commaIndex + 1).trim();
                        }
                    } else if (line.startsWith('http://') || line.startsWith('https://')) {
                        currentChannel.streamLink = line;
                        if (!currentChannel.name) {
                            currentChannel.name = line.substring(line.lastIndexOf('/') + 1);
                        }
                        parsedChannels.push({ ...currentChannel });
                        currentChannel = { name: "", logo: "", streamLink: "" };
                    }
                }

                if (parsedChannels.length === 0) {
                    container.innerHTML = `<p class="col-span-2 text-center text-[10px] text-slate-500 py-4">No channels found in playlist.</p>`;
                    return;
                }

                container.innerHTML = parsedChannels.map(ch => `
                    <a href="${ch.streamLink}" target="_blank" class="block app-card rounded-xl p-3 border border-[#232433] text-center transform active:scale-95 transition-all">
                        <div class="w-12 h-12 mx-auto bg-black/40 rounded-lg flex items-center justify-center border border-white/5 p-1.5 mb-1.5 overflow-hidden">
                            <img src="${ch.logo}" alt="${ch.name}" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' fill=\'none\' stroke=\'%2364748b\' stroke-width=\'2\' viewBox=\'0 0 24 24\'><rect width=\'20\' height=\'15\' x=\'2\' y=\'5\' rx=\'2\'/><path d=\'m17 2-5 3-5-3\'/></svg>'" class="max-w-full max-h-full object-contain rounded">
                        </div>
                        <span class="text-[10px] font-bold text-slate-200 block truncate tracking-wide">${ch.name}</span>
                    </a>`).join('');

            } catch (error) {
                console.error("Error loading M3U:", error);
                container.innerHTML = `<p class="col-span-2 text-center text-[10px] text-red-400 py-4"><i class="fa-solid fa-circle-exclamation mr-1"></i> Failed to load playlist.</p>`;
            }
        }

        // Toggle Views via Footer Navigation
        function toggleScheduleViaFooter() {
            document.getElementById("channels-section").classList.add("hidden");
            document.getElementById("homepage-section").classList.add("hidden");
            document.getElementById("filter-bar").classList.add("hidden");
            
            const section = document.getElementById("full-schedule-section");
            section.classList.remove("hidden");

            document.getElementById("footer-events-btn").className = "flex flex-col items-center cursor-pointer text-slate-400 hover:text-slate-200";
            document.getElementById("footer-sports-btn").className = "flex flex-col items-center cursor-pointer text-blue-500 font-medium";
            document.getElementById("footer-channels-btn").className = "flex flex-col items-center cursor-pointer text-slate-400 hover:text-slate-200";
            
            setTimeout(() => section.scrollIntoView({ behavior: 'smooth' }), 50);
        }

        function toggleChannelsViaFooter() {
            document.getElementById("full-schedule-section").classList.add("hidden");
            document.getElementById("homepage-section").classList.add("hidden");
            document.getElementById("filter-bar").classList.add("hidden");

            const section = document.getElementById("channels-section");
            section.classList.remove("hidden");

            document.getElementById("footer-events-btn").className = "flex flex-col items-center cursor-pointer text-slate-400 hover:text-slate-200";
            document.getElementById("footer-sports-btn").className = "flex flex-col items-center cursor-pointer text-slate-400 hover:text-slate-200";
            document.getElementById("footer-channels-btn").className = "flex flex-col items-center cursor-pointer text-blue-500 font-medium";

            setTimeout(() => section.scrollIntoView({ behavior: 'smooth' }), 50);
        }

        // Initialization on DOM Load
        document.addEventListener("DOMContentLoaded", () => {
            startLoadingScreen(); 
            renderRollingTwoDaysSchedule();
            renderFullSchedule();
            fetchAndRenderM3UPlaylist();
            
            setInterval(() => { renderRollingTwoDaysSchedule(); }, 30000);
        });
    </script>
</body>
