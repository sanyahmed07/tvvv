         // লাইভ ম্যাচ মিনিট ও ৩০ মিনিট পর কার্ড রিমুভ করার মেকানিজম
        function getMatchLiveStatus(targetMonth, targetDay, targetHour) {
            const now = new Date();
            const targetDate = new Date(2026, targetMonth, targetDay, Math.floor(targetHour), Math.round((targetHour % 1) * 60));
            const diffMs = targetDate - now;
            
             // ৯০ মিনিট খেলা + ৩০ মিনিট অতিরিক্ত বাফার = ১২০ মিনিট (২ ঘণ্টা) পর সম্পূর্ণ ডিলিট
            const removalBufferMs = 120 * 60 * 1000;
            
             if (diffMs < -removalBufferMs) {
                return { status: 'ended', html: '', isLive: false, minutesStr: '', score1: 0, score2: 0 };
            }
            
             if (diffMs <= 0) {
                const elapsedMins = Math.floor(Math.abs(diffMs) / (1000 * 60));
                let displayMins = elapsedMins > 90 ? "90+'" : `${elapsedMins}'`;
                
                let score1 = 0, score2 = 0;
                if (elapsedMins > 20) score1 = 1;
                if (elapsedMins > 50) score2 = 1;
                if (elapsedMins > 80) score1 = 2;

                return {
                    status: 'live',
                    isLive: true,
                    minutesStr: displayMins,
                    score1: score1,
                    score2: score2,
                    html: `<span class="bg-red-500/10 text-red-500 border border-red-500/30 px-1.5 py-0.5 rounded text-[8px] font-bold flex items-center gap-0.5"><span class="w-1 h-1 rounded-full bg-red-500 animate-pulse"></span> LIVE</span>`
                };
            }

             const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
            const diffHours = Math.floor((diffMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const diffMins = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));

             let countdownStr = "";
            if (diffDays > 0) countdownStr += `${diffDays}d `;
            if (diffHours > 0 || diffDays > 0) countdownStr += `${diffHours}h `;
            countdownStr += `${diffMins}m`;

             return {
                status: 'upcoming',
                isLive: false,
                minutesStr: '',
                score1: 0,
                score2: 0,
                html: `<span class="bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 px-1.5 py-0.5 rounded text-[8px] font-semibold flex items-center gap-0.5"><i class="fa-regular fa-clock text-[7px]"></i> ${countdownStr}</span>`
            };
        }

         function setFilter(filterType) {
            currentFilter = filterType;
            
             const filters = ['all', 'live', 'upcoming'];
            filters.forEach(f => {
                const btn = document.getElementById(`btn-filter-${f}`);
                if (f === filterType) {
                    btn.className = "bg-blue-600 text-white shadow-md shadow-blue-600/20 px-3 py-1 rounded-full text-[10px] font-bold whitespace-nowrap transition-all";
                } else {
                    btn.className = "bg-[#1c1d26] text-slate-400 border border-[#232433] px-3 py-1 rounded-full text-[10px] font-bold whitespace-nowrap transition-all";
                }
            });

             const titleElement = document.getElementById("section-title");
            if (filterType === 'all') titleElement.innerText = "Weekly Matches";
            if (filterType === 'live') titleElement.innerText = "Live Matches";
            if (filterType === 'upcoming') titleElement.innerText = "Upcoming Matches";

             renderRollingSevenDaysSchedule();
        }

         // রোলিং উইন্ডো: চলমান ৭ দিনের ম্যাচ ক্যালকুলেশন লজিক
        function renderRollingSevenDaysSchedule() {
            const today = new Date();
            const container = document.getElementById("rolling-matches-container");
            
             // আজকের দিন থেকে পরবর্তী ৭ দিনকে টার্গেট ফিল্টারিংয়ে আনা
            const allowedTimeframes = [];
            for (let i = 0; i < 7; i++) {
                const tempDate = new Date();
                tempDate.setDate(today.getDate() + i);
                allowedTimeframes.push({ month: tempDate.getMonth(), day: tempDate.getDate() });
            }

             const sevenDayMatches = matchSchedule.filter(m =>
                 allowedTimeframes.some(t => t.month === m.month && t.day === m.day)
             );

             let totalAll = 0, totalLive = 0, totalUpcoming = 0;
            const matchesWithStatus = sevenDayMatches.map(m => {
                const liveStatus = getMatchLiveStatus(m.month, m.day, m.hour);
                return { ...m, liveStatus };
            }).filter(m => m.liveStatus.status !== 'ended');

             matchesWithStatus.forEach(m => {
                totalAll++;
                if (m.liveStatus.status === 'live') totalLive++;
                if (m.liveStatus.status === 'upcoming') totalUpcoming++;
            });

             document.getElementById("count-all").innerText = totalAll;
            document.getElementById("count-live").innerText = totalLive;
            document.getElementById("count-upcoming").innerText = totalUpcoming;

             let filteredMatches = matchesWithStatus;
            if (currentFilter === 'live') {
                filteredMatches = matchesWithStatus.filter(m => m.liveStatus.status === 'live');
            } else if (currentFilter === 'upcoming') {
                filteredMatches = matchesWithStatus.filter(m => m.liveStatus.status === 'upcoming');
            }

             let visibleCardsHtml = "";

             filteredMatches.forEach(m => {
                const teams = m.match.split(" - ");
                const team1 = teams[0] || m.match;
                const team2 = teams[1] || "";
                const finalLink = (m.streamLink && m.streamLink.trim() !== "") ? m.streamLink : defaultStreamLink;

                 const scoreDisplay1 = m.liveStatus.isLive ? m.liveStatus.score1 : '-';
                const scoreDisplay2 = m.liveStatus.isLive ? m.liveStatus.score2 : '-';
                const minuteDisplay = m.liveStatus.isLive ? `<span class="text-[8px] bg-red-600 px-1 text-white font-mono rounded animate-pulse">${m.liveStatus.minutesStr}</span>` : '';

                 visibleCardsHtml += `
                     <a href="${finalLink}" target="_blank" class="block transform active:scale-98 transition-transform">
                         <div class="app-card rounded-xl p-2.5 flex flex-col gap-1.5 border border-[#232433]">
                             <div class="flex items-center justify-between">
                                 <div class="flex flex-col w-[35%] items-start">
                                     <div class="flex items-center gap-1">
                                         <span class="text-lg filter drop-shadow-sm">${m.team1Flag}</span>
                                         <span class="text-[10px] font-bold truncate text-slate-200 tracking-wide">${team1}</span>
                                     </div>
                                     <span class="text-[10px] font-black text-blue-500 pl-6 mt-0.5">${scoreDisplay1}</span>
                                 </div>
                                 
                                 <div class="text-center flex flex-col items-center justify-center w-[30%] bg-black/20 p-1 rounded-lg border border-white/5">
                                     <span class="text-[9px] font-bold text-white leading-tight">${m.time}</span>
                                     <span class="text-[7px] text-blue-400 font-bold tracking-tight">${m.date}</span>
                                     <div class="mt-1 flex flex-col items-center gap-0.5">
                                         ${m.liveStatus.html}
                                         ${minuteDisplay}
                                     </div>
                                 </div>
                                 
                                 <div class="flex flex-col w-[35%] items-end text-right">
                                     <div class="flex items-center gap-1 justify-end">
                                         <span class="text-[10px] font-bold truncate text-slate-200 tracking-wide">${team2}</span>
                                         <span class="text-lg filter drop-shadow-sm">${m.team2Flag}</span>
                                     </div>
                                     <span class="text-[10px] font-black text-blue-500 pr-6 mt-0.5">${scoreDisplay2}</span>
                                 </div>
                             </div>
                         </div>
                     </a>
                 `;
            });

             container.innerHTML = visibleCardsHtml || `<p class="text-[10px] text-slate-500 bg-[#1c1d26] p-4 rounded-lg text-center border border-[#232433]">No matches found</p>`;
        }

         // সম্পূর্ণ শিডিউল টেবিল রেন্ডারার (২০ জুলাই পর্যন্ত)
        function renderFullSchedule() {
            const tbody = document.getElementById("full-schedule-tbody");
            tbody.innerHTML = matchSchedule.map(m => `
                 <tr class="border-b border-[#191a24] hover:bg-white/2 transition-colors">
                     <td class="p-2 font-semibold text-blue-400 whitespace-nowrap">${m.date}</td>
                     <td class="p-2 text-slate-300 text-left truncate max-w-[110px] font-medium">${m.match}</td>
                     <td class="p-2 font-semibold text-emerald-400 whitespace-nowrap">${m.time}</td>
                 </tr>
             `).join('');
        }

         function toggleScheduleViaFooter() {
            const section = document.getElementById("full-schedule-section");
            const footerBtn = document.getElementById("footer-sports-btn");

             if (section.classList.contains("hidden")) {
                section.classList.remove("hidden");
                footerBtn.classList.add("text-blue-500");
                setTimeout(() => section.scrollIntoView({ behavior: 'smooth' }), 50);
            } else {
                section.classList.add("hidden");
                footerBtn.classList.remove("text-blue-500");
            }
        }

         document.addEventListener("DOMContentLoaded", () => {
            renderRollingSevenDaysSchedule();
            renderFullSchedule();
            
             // অটো আপডেট ইন্টারভাল (৩০ সেকেন্ড)
            setInterval(() => {
                renderRollingSevenDaysSchedule();
            }, 30000);
        });
    </script>
</body>
</html>
